name: resnet18
title: ResNet-18
task: classification
dataset: imagenet
metric: top1
input:
  name: images
  shape:
  - 1
  - 3
  - 224
  - 224
  dtype: float32
  layout: NCHW
graphs:
  network: network.onnx
preprocess:
  kind: center_crop
  resize: 256
  crop: 224
  interpolation: bilinear
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
decode:
  kind: logits
  output: logits
source:
  framework: torchvision 0.20.1 (3ac97aa9120137381ed1060f37237e44485ac2aa)
  builder: resnet18
  weights: IMAGENET1K_V1
  url: https://download.pytorch.org/models/resnet18-f37072fd.pth
  sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
  license: BSD-3-Clause (code); ImageNet-derived weights
export:
  family: torchvision
  opset: 18
  simplify: true
  framework_parity:
    rtol: 0.0001
    atol: 1.0e-05
    logits_absolute_bound: 0.0001
    require_top5_order: true
network_input_map:
  images: images
